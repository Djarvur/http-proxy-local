# http-proxy-local example configuration.
#
# Copy to ~/.config/http-proxy-local/config.yaml and edit. Every field has
# a default; you only need to set the fields you want to override.
#
# This file is hot-reloaded: save your changes and the next /proxy.pac
# request reflects them. (Changes to `listen` require a restart.)

# Local bind address for the proxy + PAC server. Default 127.0.0.1:8080.
# Use 127.0.0.1 (not 0.0.0.0) unless you have a reason to expose the proxy
# beyond localhost — it has no client auth.
listen: 127.0.0.1:8080

# Upstream proxy all non-PAC requests cascade to.
upstream:
  # URL of the upstream proxy. May be http:// or https:// (the scheme
  # applies to the connection TO the upstream, not to the requests it
  # forwards). An empty string means "no upstream, connect direct" —
  # useful for testing or for deployments where only the PAC matters.
  url: https://upstream.example.com:3128

  # Optional basic auth credentials for the upstream proxy. Sent as
  # Proxy-Authorization. If either is empty, no auth header is added.
  username: ""
  password: ""

# RU geo-data fetcher.
geo:
  # Source URL for the RIPE delegation list. Override only if you want a
  # mirror or a different RIR's data.
  # Default: https://ftp.ripe.net/pub/stats/ripencc/delegated-ripencc-latest
  source_url: https://ftp.ripe.net/pub/stats/ripencc/delegated-ripencc-latest

  # Interval between successful refreshes. Default 24h.
  refresh_interval: 24h

  # Interval after a failed refresh, repeating until success. Should be
  # much shorter than refresh_interval so a transient outage recovers
  # quickly. Default 5m.
  retry_interval: 5m

# Routing overrides. Applied by the PAC before the RU geo rule.
routing:
  # Whitelist: force these hosts through the upstream proxy, overriding
  # local-network and RU geo rules. (Cannot override blacklist.)
  #
  # Entries match by suffix (*.example.com matches example.com and any
  # subdomain) or by CIDR (10.0.0.0/8 matches any IP in that range).
  whitelist:
    - "*.forced.example.com"
    - "exact.example.org"
    # - "10.0.0.0/8"      # forces ALL of 10.x through the upstream

  # Blacklist: force these hosts to connect DIRECT, overriding whitelist,
  # local-network, and RU geo. Use for hosts that must NEVER traverse the
  # upstream (e.g. internal corp hostnames, banking sites).
  blacklist:
    - "*.internal.corp"
    - "banking.example.com"
    # - "192.168.0.0/16"  # forces all of 192.168.x direct (also default behavior)

# PAC serving options. Currently just the cache TTL on the /proxy.pac
# response, exposed as the Cache-Control header.
pac:
  # Cache TTL in seconds for the served PAC, emitted as
  # `Cache-Control: max-age=N, must-revalidate`. macOS does not re-read the
  # PAC on a fixed timer — it honors this header — so the value
  # bounds how quickly hot-reloaded config reaches the browser.
  #
  # - omitted       → default 15s (good balance: short enough that edits
  #                  reach the browser within ~15s, long enough that the
  #                  PAC isn't refetched on every request)
  # - 0             → disable caching (emit `Cache-Control: no-cache`);
  #                  the browser revalidates on every fetch. Use when
  #                  you're iterating on config and want instant pickup.
  # - N > 0         → cache for N seconds
  # Negative values are rejected by the validator.
  cache_seconds: 15

# Optional SOCKS5 inbound listener. Useful for clients that speak SOCKS5
# but not HTTP proxy — most notably the Telegram desktop/mobile client,
# which cannot use an HTTP/HTTPS proxy. Traffic entering here is tunneled
# through the SAME upstream cascade as browser traffic, so it is
# indistinguishable to DPI.
#
# The listener is OPT-IN: it only starts when `socks5.listen` is non-empty.
# There is NO activating default port — you MUST write a value (or any
# non-empty value) here to enable it. Omit the block entirely, or leave
# `listen` empty, and the binary behaves exactly as before (full backward
# compatibility).
#
# Only the CONNECT command (TCP) is supported. BIND and UDP ASSOCIATE are
# refused — the upstream cascade is TCP-only, so UDP has no transport
# through it. Telegram voice/video calls fall back to TCP relay (degraded
# quality but functional); messages, media, and channels work normally.
#
# No client authentication: only the "No Authentication Required" SOCKS5
# method (0x00) is accepted. This matches the localhost-only posture of
# the HTTP listener; do NOT bind to wildcard (0.0.0.0) without understanding
# you'd be running an open proxy.
#
# Hot-reload: changing `socks5.listen` (or adding/removing the block)
# logs a restart-required error — the listener is not rebound, started,
# or stopped mid-flight. Same posture as the HTTP `listen` field.
# socks5:
#   listen: 127.0.0.1:1080

# Optional smart HTTP listener — a SECOND HTTP listener on a separate port
# that applies the same routing precedence as the PAC (blacklist → whitelist
# → local/private → RU geo → default) but evaluates it server-side. Intended
# for clients that ignore the system PAC and expose no way to inject one
# (notably the zcode CLI), so their traffic gets the same DIRECT/Upstream
# decisions a browser would make via the PAC. Browsers keep using the dumb
# HTTP listener + PAC; PAC-blind clients point at this listener.
#
# The listener is OPT-IN: it only starts when `smart.listen` is non-empty.
# There is NO activating default port — you MUST write a value (or any
# non-empty value) here to enable. Omit the block entirely, or leave
# `listen` empty, and the binary behaves exactly as before (full backward
# compatibility).
#
# Routing precedence (mirrors the PAC; first match wins):
#   1. blacklist  → [Direct, Upstream]  (direct first, fall back to upstream
#                                        if direct fails — e.g. z.ai briefly
#                                        unreachable directly)
#   2. whitelist  → [Upstream]
#   3. local/private network → [Direct]
#   4. RU IPv4 (any resolved IP in a RU range) → [Direct], dialed via the
#      matched RU IP. NO fallback — move the host to the whitelist if direct
#      is unreliable.
#   5. default → [Upstream]
#
# The smart listener resolves hostnames via the system resolver (it does NOT
# add its own DNS cache — the system resolver already caches correctly).
# It does NOT serve /proxy.pac (PAC-blind clients don't fetch it, and the
# PAC's PROXY directive would point at the dumb listener anyway).
#
# Negative cache: when a Direct attempt fails (blacklist case), the hostname
# is remembered as "direct-down" for `negative_cache_ttl`, so subsequent
# requests skip the doomed Direct attempt and go straight to upstream.
#
# Hot-reload:
#   - routing rules (whitelist/blacklist): apply on the next request, no
#     restart (per-request read of the live config).
#   - `smart.listen` (or adding/removing the block): restart required — the
#     listener is not rebound mid-flight. Same posture as `listen`/`socks5.listen`.
#   - tuning fields (dial_timeout/dial_attempts/negative_cache_ttl): apply on
#     the next request, no restart.
# smart:
#   listen: 127.0.0.1:8081
#   dial_timeout: 3s           # per-attempt timeout for Direct dials
#   dial_attempts: 2           # Direct retries before falling back to upstream
#   negative_cache_ttl: 60s    # how long to remember a Direct failure
#
# Optional transparent listener — a FOURTH opt-in listener that captures
# TCP connections the local firewall redirected to it (iptables REDIRECT),
# recovers the ORIGINAL destination from the socket (SO_ORIGINAL_DST), applies
# the same routing precedence as the smart listener, and relays the stream
# raw. This replaces an external redsocks daemon in the interception chain:
# the kernel-side plumbing (iptables rule + ipset of intercepted CIDRs + a
# oneshot service that installs them) stays exactly as is — only the REDIRECT
# target port now points at this listener instead of redsocks.
#
# The listener is OPT-IN: it only starts when `transparent.listen` is
# non-empty. Omit the block (or leave `listen` empty) and the binary behaves
# exactly as before (full backward compatibility).
#
# The RECOMMENDED value is 127.0.0.1:12345 — the port redsocks used — so the
# existing `REDIRECT --to-ports 12345` firewall rule needs no change at
# cutover. It is NOT a default: you MUST write a value to enable.
#
# Linux-only: destination recovery uses SO_ORIGINAL_DST, a Linux kernel
# feature. On non-Linux platforms (macOS) a non-empty `transparent.listen`
# FAILS startup with a clear error rather than silently ignoring the block.
#
# Loop-risk convention: a destination in the interception ipset MUST NEVER be
# added to `routing.blacklist`. A blacklisted destination dials Direct —
# straight back into the intercepted CIDR, looping through the firewall
# redirect forever. The listener logs a WARNING naming the destination when
# its routing resolves to Direct; treat that warning as a config error.
#
# Hot-reload: changing `transparent.listen` (or adding/removing the block)
# logs a restart-required error — the listener is not rebound, started, or
# stopped mid-flight. Same posture as `listen`/`socks5.listen`/`smart.listen`.
#
# No client authentication: it inherits the localhost-only posture of the
# other listeners; only connections the local firewall redirected ever reach
# it.
# transparent:
#   listen: 127.0.0.1:12345
