# http-proxy-local example configuration.
#
# Copy to ~/.config/http-proxy-local/config.yaml and edit. Every field has
# a default; you only need to set the fields you want to override.
#
# This file is hot-reloaded: save your changes and the next /proxy.pac
# request reflects them. (Changes to `listen` require a restart.)

# Local bind address for the proxy + PAC server. Default 127.0.0.1:8080.
# Use 127.0.0.1 (not 0.0.0.0) unless you have a reason to expose the proxy
# beyond localhost — it has no client auth.
listen: 127.0.0.1:8080

# Upstream proxy all non-PAC requests cascade to.
upstream:
  # URL of the upstream proxy. May be http:// or https:// (the scheme
  # applies to the connection TO the upstream, not to the requests it
  # forwards). An empty string means "no upstream, connect direct" —
  # useful for testing or for deployments where only the PAC matters.
  url: https://upstream.example.com:3128

  # Optional basic auth credentials for the upstream proxy. Sent as
  # Proxy-Authorization. If either is empty, no auth header is added.
  username: ""
  password: ""

# RU geo-data fetcher.
geo:
  # Source URL for the RIPE delegation list. Override only if you want a
  # mirror or a different RIR's data.
  # Default: https://ftp.ripe.net/pub/stats/ripencc/delegated-ripencc-latest
  source_url: https://ftp.ripe.net/pub/stats/ripencc/delegated-ripencc-latest

  # Interval between successful refreshes. Default 24h.
  refresh_interval: 24h

  # Interval after a failed refresh, repeating until success. Should be
  # much shorter than refresh_interval so a transient outage recovers
  # quickly. Default 5m.
  retry_interval: 5m

# Routing overrides. Applied by the PAC before the RU geo rule.
routing:
  # Whitelist: force these hosts through the upstream proxy, overriding
  # local-network and RU geo rules. (Cannot override blacklist.)
  #
  # Entries match by suffix (*.example.com matches example.com and any
  # subdomain) or by CIDR (10.0.0.0/8 matches any IP in that range).
  whitelist:
    - "*.forced.example.com"
    - "exact.example.org"
    # - "10.0.0.0/8"      # forces ALL of 10.x through the upstream

  # Blacklist: force these hosts to connect DIRECT, overriding whitelist,
  # local-network, and RU geo. Use for hosts that must NEVER traverse the
  # upstream (e.g. internal corp hostnames, banking sites).
  blacklist:
    - "*.internal.corp"
    - "banking.example.com"
    # - "192.168.0.0/16"  # forces all of 192.168.x direct (also default behavior)

# PAC serving options. Currently just the cache TTL on the /proxy.pac
# response, exposed as the Cache-Control header.
pac:
  # Cache TTL in seconds for the served PAC, emitted as
  # `Cache-Control: max-age=N, must-revalidate`. macOS does not re-read the
  # PAC on a fixed timer — it honors this header — so the value
  # bounds how quickly hot-reloaded config reaches the browser.
  #
  # - omitted       → default 15s (good balance: short enough that edits
  #                  reach the browser within ~15s, long enough that the
  #                  PAC isn't refetched on every request)
  # - 0             → disable caching (emit `Cache-Control: no-cache`);
  #                  the browser revalidates on every fetch. Use when
  #                  you're iterating on config and want instant pickup.
  # - N > 0         → cache for N seconds
  # Negative values are rejected by the validator.
  cache_seconds: 15

# Optional SOCKS5 inbound listener. Useful for clients that speak SOCKS5
# but not HTTP proxy — most notably the Telegram desktop/mobile client,
# which cannot use an HTTP/HTTPS proxy. Traffic entering here is tunneled
# through the SAME upstream cascade as browser traffic, so it is
# indistinguishable to DPI.
#
# The listener is OPT-IN: it only starts when `socks5.listen` is non-empty.
# There is NO activating default port — you MUST write a value (or any
# non-empty value) here to enable it. Omit the block entirely, or leave
# `listen` empty, and the binary behaves exactly as before (full backward
# compatibility).
#
# Only the CONNECT command (TCP) is supported. BIND and UDP ASSOCIATE are
# refused — the upstream cascade is TCP-only, so UDP has no transport
# through it. Telegram voice/video calls fall back to TCP relay (degraded
# quality but functional); messages, media, and channels work normally.
#
# No client authentication: only the "No Authentication Required" SOCKS5
# method (0x00) is accepted. This matches the localhost-only posture of
# the HTTP listener; do NOT bind to wildcard (0.0.0.0) without understanding
# you'd be running an open proxy.
#
# Hot-reload: changing `socks5.listen` (or adding/removing the block)
# logs a restart-required error — the listener is not rebound, started,
# or stopped mid-flight. Same posture as the HTTP `listen` field.
# socks5:
#   listen: 127.0.0.1:1080
